name: Decal
options:
  bundleIdPrefix: com.wancai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Decal:
    type: application
    platform: iOS
    sources:
      # decal.html 是 Web 参考实现，不进包（原生版已不需要 WKWebView）
      - path: Decal
        excludes:
          - "decal.html"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wancai.decal
        PRODUCT_NAME: Decal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Decal/Info.plist
      properties:
        CFBundleDisplayName: 贴花
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: 保存处理后的照片到你的相册。
        NSPhotoLibraryUsageDescription: 从相册选择照片进行编辑。
        NSCameraUsageDescription: 现场拍一张照片，直接把贴花贴到墙面上。
        ITSAppUsesNonExemptEncryption: false

schemes:
  Decal:
    build:
      targets:
        Decal: all
    run:
      config: Debug
    archive:
      config: Release
