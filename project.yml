name: Decal
options:
  bundleIdPrefix: com.wancai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Decal:
    type: application
    platform: iOS
    sources:
      # decal.html 是 Web 参考实现，不进包（原生版已不需要 WKWebView）
      - path: Decal
        excludes:
          - "decal.html"
      # 深度模型（Depth Anything V2 Small）。CI 用 coremlcompiler 把 mlpackage
      # 编译成 .mlmodelc 写进这里；仓库里只有 .keep，所以本地也能正常 generate。
      #
      # 用 folder + resources 而不是让 Xcode 认成 mlmodel：.mlmodelc 已经是编译产物，
      # 再被当源码编一次会直接崩在 build 阶段。folder reference 只是原样拷进 bundle 根。
      - path: Model/DepthAnythingV2SmallF16.mlmodelc
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wancai.decal
        PRODUCT_NAME: Decal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Decal/Info.plist
      properties:
        CFBundleDisplayName: 贴花
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: 保存处理后的照片到你的相册。
        NSPhotoLibraryUsageDescription: 从相册选择照片进行编辑。
        NSCameraUsageDescription: 现场拍一张照片，直接把贴花贴到墙面上。
        ITSAppUsesNonExemptEncryption: false

  # 纹理格式与通道顺序：必须在 iOS 环境里跑，macOS 支持的超集不代表 iOS 支持
  DecalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DecalTests
    dependencies:
      - target: Decal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wancai.decal.tests
        GENERATE_INFOPLIST_FILE: YES

  # 只在模拟器里点按钮，证明点击能到达（编译发现不了这类问题）
  DecalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DecalUITests
    dependencies:
      - target: Decal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wancai.decal.uitests
        TEST_TARGET_NAME: Decal
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Decal:
    build:
      targets:
        Decal: all
        DecalTests: [test]
        DecalUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DecalTests
        - DecalUITests
    archive:
      config: Release
