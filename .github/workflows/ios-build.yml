name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # 编译并运行真正打进 App 的那份 Swift 单应实现（不启模拟器，五秒）
      - name: Swift math check
        run: |
          swiftc -O Decal/Homography.swift test/HomographyCheck.swift -o /tmp/hcheck
          /tmp/hcheck

      # JS 参考实现的同组用例，两边口径必须一致
      - name: JS reference check
        run: node verify_homography.mjs

      # 光照层数学：亮度守恒 / 饱和度只降不升 / shade=0 完整退化。纯标准库，不需要 numpy
      - name: Light layer check
        run: python3 test/light_check.py

      # 深度模型 ~50MB，本地 HF 不通、也不该入库，CI 下载一次后走缓存
      - name: Cache depth model
        id: cache-depth-model
        uses: actions/cache@v4
        with:
          path: /tmp/model
          key: depth-anything-v2-small-f16-v1

      - name: Download depth model
        if: steps.cache-depth-model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --upgrade pip huggingface_hub
          /tmp/venv/bin/python -c "from huggingface_hub import snapshot_download as s; s('apple/coreml-depth-anything-v2-small', allow_patterns=['DepthAnythingV2SmallF16.mlpackage/*'], local_dir='/tmp/model')"
          du -sh /tmp/model/DepthAnythingV2SmallF16.mlpackage

      # mlpackage → mlmodelc。App 里只认编译产物，运行时不再编译（那要十几秒）
      - name: Compile depth model
        run: |
          set -euo pipefail
          rm -rf Model/DepthAnythingV2SmallF16.mlmodelc
          xcrun coremlcompiler compile \
            /tmp/model/DepthAnythingV2SmallF16.mlpackage Model/
          ls -la Model/DepthAnythingV2SmallF16.mlmodelc
          du -sh Model/DepthAnythingV2SmallF16.mlmodelc

      # 编译真源码跑一遍推理，钉住「模型能加载 / 输出 518×392 / 值域 0..1 /
      # 认得出圆柱曲率 / 前景比背景近」。模拟器 UI 测试要 7 分钟，
      # 这一步 5 秒，失败时能立刻分清是模型层还是渲染层的问题。
      - name: Depth model boot check
        run: |
          set -euo pipefail
          swiftc -O Decal/DepthModel.swift test/DepthBootCheck.swift -o /tmp/dchk
          DECAL_ROOT="$GITHUB_WORKSPACE" /tmp/dchk

      - name: Generate Xcode project
        run: xcodegen generate

      # 在模拟器里真点一次「拍一张」：模拟器没有相机 → 应弹出「这台设备没有可用相机」。
      # 这句话出现就证明点击到达了按钮；没出现说明又被画布手势吞了（真机报过的问题，
      # 编译和静态检查都发现不了，只有真的点一次才知道）
      - name: UI smoke test (simulator)
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];n=[x['name'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']];print(n[0] if n else 'iPhone 16')")
          echo "simulator = $DEV"
          set +e
          xcodebuild test \
            -project Decal.xcodeproj \
            -scheme Decal \
            -destination "platform=iOS Simulator,name=$DEV" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO
          RC=$?
          mkdir -p shots
          find ~/Library/Developer/CoreSimulator/Devices -name 'decal-shot-*.png' -exec cp {} shots/ \; 2>/dev/null
          ls -la shots || true
          exit $RC

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: shots
          if-no-files-found: warn
          retention-days: 14

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Decal.xcodeproj \
            -scheme Decal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "no .app produced"; exit 1; fi
          echo "app = $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Decal-unsigned.ipa Payload
          ls -lh Decal-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Decal-unsigned-ipa
          path: Decal-unsigned.ipa
          retention-days: 14
