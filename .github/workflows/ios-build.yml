name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # 编译并运行真正打进 App 的那份 Swift 单应实现（不启模拟器，五秒）
      - name: Swift math check
        run: |
          swiftc -O Decal/Homography.swift test/HomographyCheck.swift -o /tmp/hcheck
          /tmp/hcheck

      # JS 参考实现的同组用例，两边口径必须一致
      - name: JS reference check
        run: node verify_homography.mjs

      # 纹理上传的通道顺序与行序（真机上报过照片发蓝、贴图发虚）
      - name: Texture upload check
        run: |
          swiftc -O Decal/TextureIO.swift test/TextureCheck.swift -o /tmp/tcheck
          /tmp/tcheck

      - name: Generate Xcode project
        run: xcodegen generate

      # 在模拟器里真点一次「拍一张」：模拟器没有相机 → 应弹出「这台设备没有可用相机」。
      # 这句话出现就证明点击到达了按钮；没出现说明又被画布手势吞了（真机报过的问题，
      # 编译和静态检查都发现不了，只有真的点一次才知道）
      - name: UI smoke test (simulator)
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];n=[x['name'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']];print(n[0] if n else 'iPhone 16')")
          echo "simulator = $DEV"
          xcodebuild test \
            -project Decal.xcodeproj \
            -scheme Decal \
            -destination "platform=iOS Simulator,name=$DEV" \
            -derivedDataPath build-test \
            -only-testing:DecalUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Decal.xcodeproj \
            -scheme Decal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "no .app produced"; exit 1; fi
          echo "app = $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Decal-unsigned.ipa Payload
          ls -lh Decal-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Decal-unsigned-ipa
          path: Decal-unsigned.ipa
          retention-days: 14
