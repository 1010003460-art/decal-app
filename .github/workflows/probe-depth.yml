name: Probe Depth Model

# 一次性用途：确认 apple/coreml-depth-anything-v2-small 的实际行为。
# 1) 下载模型  2) 在真实照片上跑  3) 导出深度图 artifact
# 拿到结果后这个 workflow 可以删。

on:
  push:
    paths:
      - ".github/workflows/probe-depth.yml"
      - "test/run_depth.swift"
      - "test/*.png"
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download model from Hugging Face
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --upgrade pip huggingface_hub
          /tmp/venv/bin/python -c "from huggingface_hub import snapshot_download as s; print(s('apple/coreml-depth-anything-v2-small', allow_patterns=['DepthAnythingV2SmallF16.mlpackage/*'], local_dir='/tmp/model'))"
          du -sh /tmp/model/DepthAnythingV2SmallF16.mlpackage

      - name: Run on real photos and export depth maps
        run: |
          set -euo pipefail
          mkdir -p /tmp/depth
          swiftc -O test/run_depth.swift -o /tmp/run
          DECAL_ROOT="$GITHUB_WORKSPACE" /tmp/run
          ls -la /tmp/depth

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth-maps
          path: /tmp/depth/*.png
          if-no-files-found: warn
